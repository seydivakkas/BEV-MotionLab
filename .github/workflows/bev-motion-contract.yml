name: BEV conditional metric-motion contract
on:
  pull_request:
  push:
    branches:
      - feature/backend-v0.1
  workflow_dispatch:
permissions:
  contents: read
jobs:
  motion_smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local package without third-party cloud API
        run: python -m pip install -e .
      - name: Regress integrated BEVMotionModule
        run: python -m unittest tests.test_motion_module tests.test_motion_api_cli -v
      - name: Verify complete synthetic JSONL computation and hash ledger
        shell: bash
        run: |
          python -m bevmotionlab.motion_cli --calibration examples/motion_calibration.json --input examples/motion_samples.jsonl --out ci-motion-out
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          d=Path('ci-motion-out')
          m=json.loads((d/'manifest.json').read_text())
          assert m['real_data_accepted'] is False
          for filename,digest in m['sha256'].items():
              assert hashlib.sha256((d/filename).read_bytes()).hexdigest()==digest
          report=json.loads((d/'motion_report.json').read_text())
          assert report['calibration']['quality_gate']['passed']
          assert len(report['records'])==8
          assert any(v['status']=='UNCERTAIN_PROJECTION' for v in report['records'])
          print('BEV_SYNTHETIC_CONDITIONAL_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bev-conditional-motion-evidence
          path: ci-motion-out/
          if-no-files-found: warn
          retention-days: 90
