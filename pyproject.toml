[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "bevmotionlab"
version = "0.1.0"
description = "Offline camera homography and ground-plane speed engineering laboratory"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]
[project.scripts]
bevmotionlab = "bevmotionlab.cli:main"
[tool.setuptools.packages.find]
where = ["src"]